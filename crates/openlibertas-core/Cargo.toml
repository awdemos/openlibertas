[package]
name = "openlibertas-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["sync", "process", "io-util", "macros", "rt", "rt-multi-thread"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
directories = "5"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
thiserror = "1"
cpal = "0.15"
rodio = { version = "0.19", features = ["symphonia"] }
hound = "3.5"
unicode-width = "0.1"
glob = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
